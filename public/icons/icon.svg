<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" shape-rendering="geometricPrecision">
  <!-- Riptag favicon: minimalist empty clothes hanger.
       Brand-green outline on near-black rounded square. Stroke-only, no fill,
       so the silhouette stays crisp at 16px favicon size. -->

  <!-- Dark rounded background -->
  <rect width="64" height="64" rx="14" fill="#0a0e13"/>
  <rect x="0.5" y="0.5" width="63" height="63" rx="13.5" fill="none"
        stroke="rgba(0,229,160,0.22)" stroke-width="1"/>

  <g fill="none" stroke="#00e5a0" stroke-width="4"
     stroke-linecap="round" stroke-linejoin="round">
    <!-- Hook curling to the left from the apex of the triangle -->
    <path d="M 32 24 L 32 13 Q 32 7 27 7 Q 22 7 22 12"/>
    <!-- Triangle hanger body with bottom bar -->
    <path d="M 12 46 L 32 24 L 52 46 Z"/>
  </g>
</svg>
